  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(D.s),iterations:D.i,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(D.v)},key,b(D.c)));
  try{sessionStorage.setItem('fxpw',pw)}catch(x){}
  document.open();document.write(html);document.close();
}
if(!window.crypto||!crypto.subtle){const h=document.getElementById('h');h.style.display='block';
  const l=document.getElementById('hl');l.href='https://'+location.host+location.pathname+location.search;l.textContent=l.href;}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();if(!window.crypto||!crypto.subtle)return;
  open_(document.getElementById('pw').value).catch(()=>{document.getElementById('e').style.display='block'});});
let s=null;try{s=sessionStorage.getItem('fxpw')}catch(x){}
if(s)open_(s).catch(()=>{});
</script></body></html>
