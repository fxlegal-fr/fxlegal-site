async function open_(pw){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(D.s),iterations:D.i,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(D.v)},key,b(D.c)));
  try{sessionStorage.setItem('fxpw',pw)}catch(x){}
  document.open();document.write(html);document.close();
}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();
  open_(document.getElementById('pw').value).catch(()=>{document.getElementById('e').style.display='block'});});

if(s)open_(s).catch(()=>{});
